# 공통 설정. 프로파일로 local / dev / prod 구분 (미지정 시 local)
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: janggunkitchen
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    jwt:
      secret: ${JWT_SECRET:xA0sn7p9tB6cR3eMkG4vzS5uQ2W1yNpLqZoPsIdUjKxBlVuTwQ1FgHsDnPmCkRtL}
      accessTokenTtlSeconds: ${JWT_ACCESS_TOKEN_TTL:3600}
      refreshTokenSecret: ${JWT_REFRESH_SECRET:rF9kL2mN5pQ8sT1vW4xY7zA0bC3dE6fH9iJ2lM5oP8qR1tU4wX7yZ0aB3cD6e}
      refreshTokenTtlSeconds: ${JWT_REFRESH_TOKEN_TTL:604800}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

server:
  port: ${SERVER_PORT:8080}

app:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${STORAGE_BASE_DIR:C:\JangJinSeok\99. Archive\test/uploads}
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
