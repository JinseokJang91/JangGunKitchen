services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE_REPO:-janggunkitchen-backend}:${BACKEND_IMAGE_TAG:-latest}
    container_name: janggunkitchen_app
    restart: unless-stopped
    env_file:
      - path: ./.env.secrets
        required: false
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
    command: ["/app/app.jar", "--server.port=8080"]
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:17
    container_name: janggunkitchen_postgres
    restart: unless-stopped
    env_file:
      - path: ./.env.secrets
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
